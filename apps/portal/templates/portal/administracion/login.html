{% extends "portal/base.html" %}
{% block title %}Ingresar a Administración · Y3P{% endblock %}
{% block content %}
<section class="mx-auto max-w-md rounded-2xl bg-white p-6 shadow-sm">
  <h1 class="mb-4 text-2xl font-bold">Ingresar a Administración</h1>
  <p class="mb-4 text-slate-600">Utilice su cuenta institucional de operador. El grupo asignado determina las herramientas disponibles.</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="mt-4 rounded-lg bg-blue-700 px-5 py-3 text-white">Ingresar</button>
  </form>
</section>
{% endblock %}
