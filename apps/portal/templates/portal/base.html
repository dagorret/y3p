<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Portal Operativo · Y3P{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
    <header class="{% block header_classes %}border-b border-slate-200 bg-white{% endblock %}">
      <div class="{% block header_container_classes %}mx-auto flex max-w-7xl flex-col gap-4 px-4 py-5 sm:flex-row sm:items-center sm:justify-between lg:px-8{% endblock %}">
        <a href="{{ portal_home_url }}" class="text-xl font-bold tracking-tight text-slate-900">Y3P <span class="font-normal text-slate-500">· Portal operativo</span></a>
        <nav aria-label="Portales operativos" class="flex flex-wrap gap-2">
          {% for item in scope_navigation %}<a href="{{ item.url }}" data-scope="{{ item.scope }}" {% if item.active %}aria-current="location"{% endif %} class="rounded-lg px-4 py-2 text-sm font-semibold {% if item.active %}bg-blue-700 text-white{% else %}text-slate-600 hover:bg-slate-100{% endif %}">{{ item.label }}</a>{% endfor %}
        </nav>
      </div>
    </header>
    <main class="{% block main_classes %}mx-auto max-w-7xl px-4 py-8 lg:px-8{% endblock %}">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
