{% comment %}
#FPORTALHTML01-12119: Opciones de canales desde el catálogo local, sin consultas remotas al abrir el selector.
Anclaje: catalog-channels.
La visibilidad acompaña permisos del servidor; ocultar controles no reemplaza su validación.
{% endcomment %}

<label id="catalog-channels">
  Canal del equipo
  <select name="channel_id">
    <option value="">Seleccione un canal</option>
    {% for channel in catalog_channels %}
      <option value="{{ channel.channel_id }}">
        {{ channel.display_name }} · {{ channel.get_membership_type_display }}
      </option>
    {% endfor %}
  </select>
</label>
