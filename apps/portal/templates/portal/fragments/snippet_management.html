  {% if can_operate_daily %}
  <details class="mb-4 rounded-xl border bg-white p-4">
    <summary class="cursor-pointer font-semibold">Guardar como Snippet</summary>
    <form method="post" action="{{ snippet_create_url }}" hx-post="{{ snippet_create_url }}" hx-include="#student-filters" hx-target="#query-builder" hx-swap="outerHTML" class="mt-3 space-y-3">
      {% csrf_token %}<input type="hidden" name="builder_mode" value="1">
      <label>Nombre de la vista<input name="snippet_name" maxlength="150" required></label>
      <label><input type="checkbox" name="is_shared"> Compartir con el equipo de administración</label>
      <button type="submit" class="rounded-lg bg-blue-700 px-4 py-2 text-white">Guardar como Snippet</button>
    </form>
  </details>
  <details class="mb-4 rounded-xl border bg-white p-4">
    <summary class="cursor-pointer font-semibold">Administrar vistas guardadas</summary>
    {% for snippet in snippets %}{% if snippet.can_delete %}
      <form method="post" action="{{ snippet.delete_url }}" hx-post="{{ snippet.delete_url }}" hx-include="#student-filters" hx-target="#query-builder" hx-swap="outerHTML" hx-confirm="¿Eliminar esta vista guardada?" class="mt-3 flex items-center gap-3">
        {% csrf_token %}<input type="hidden" name="builder_mode" value="1"><span>{{ snippet.name }}</span><button type="submit" class="text-red-700 underline">Eliminar vista guardada</button>
      </form>
    {% endif %}{% endfor %}
  </details>
  {% endif %}
